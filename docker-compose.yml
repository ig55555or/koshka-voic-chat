services:
  voice:
    build: .
    image: voice-chat:latest
    container_name: voice-chat
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    # Порт открыт только на 127.0.0.1 — из интернета напрямую недоступен, только через Caddy.
    ports:
      - "127.0.0.1:${VOICE_PORT:-18080}:8080"
    volumes:
      - voice-data:/data          # аккаунты и комнаты, переживают обновления

  # TURN/STUN-сервер: пересылает звук, когда напрямую соединиться нельзя (NAT провайдера,
  # мобильный интернет). run.sh включает его сам (профиль turn).
  coturn:
    image: coturn/coturn:4.6
    container_name: voice-coturn
    restart: unless-stopped
    profiles: [turn]
    network_mode: host          # TURN работает по UDP с диапазоном портов — проще через host
    # Сертификат домена берётся из данных Caddy только для чтения (run.sh находит папку сам).
    # Запуск от root нужен лишь чтобы прочитать ключ (у Caddy он 600) — после старта coturn
    # сам сбрасывает права до nobody (--proc-user).
    user: "0:0"
    volumes:
      - ${TURN_CERT_DIR:-./certs}:/certs:ro
    command:
      - -n
      - --log-file=stdout
      - --simple-log
      - --listening-port=3478
      # TURN поверх TLS: для сети выглядит как обычный HTTPS — проходит там, где 3478 режут
      - --tls-listening-port=5349
      - --cert=/certs/${TURN_DOMAIN:-none}.crt
      - --pkey=/certs/${TURN_DOMAIN:-none}.key
      - --no-tlsv1
      - --no-tlsv1_1
      - --proc-user=nobody
      - --proc-group=nogroup
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-voice}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --no-cli
      - --no-dtls
      - --no-multicast-peers
      - --user-quota=12
      - --total-quota=200
      # не пускать через TURN к локальным/внутренним адресам сервера (Caddy, VPN, docker)
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  voice-data:
